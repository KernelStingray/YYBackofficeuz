      deleted_at:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      is_verified_myid:
        type: boolean
      last_name:
        type: string
      locale:
        type: string
      myid_serial_hash:
        type: string
      phone_number:
        type: string
      rating:
        type: number
      rating_count:
        type: integer
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  http.AddPaymentMethodRequest:
    properties:
      masked_pan:
        type: string
      provider:
        type: string
      token:
        type: string
    required:
    - masked_pan
    - provider
    - token
    type: object
  http.BookRideRequest:
    properties:
      is_full_car_buyout:
        type: boolean
      offered_price:
        type: number
      seats:
        type: integer
    required:
    - seats
    type: object
  http.CancelRideRequest:
    properties:
      reason:
        type: string
    type: object
  http.CreateCarRequest:
    properties:
      brand:
        type: string
      gov_number:
        type: string
      model:
        type: string
      tech_passport_photo:
        type: string
    required:
    - brand
    - gov_number
    - model
    type: object
  http.GiftInjectRequest:
    properties:
      quota:
        type: integer
    required:
    - quota
    type: object
  http.LoginRequest:
    properties:
      password:
        type: string
      phone_number:
        type: string
    required:
    - password
    - phone_number
    type: object
  http.PublishRideRequest:
    properties:
      departure_time:
        description: RFC3339 format
        type: string
      destination_address:
        type: string
      destination_lat:
        type: number
      destination_lon:
        type: number
      gender_restriction:
        type: string
      has_ac:
        type: boolean
      has_luggage:
        type: boolean
      is_negotiable:
        type: boolean
      origin_address:
        type: string
      origin_lat:
        type: number
      origin_lon:
        type: number
      pickup_point:
        type: string
      price_per_seat:
        type: number
      stops:
        items:
          $ref: '#/definitions/http.RideStopRequest'
        type: array
      takes_parcels:
        type: boolean
      total_seats:
        type: integer
      vehicle_id:
        type: string
    required:
    - departure_time
    - destination_address
    - destination_lat
    - destination_lon
    - origin_address
    - origin_lat
    - origin_lon
    - price_per_seat
    - total_seats
    - vehicle_id
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  http.RegisterPassengerRequest:
    properties:
      first_name:
        maxLength: 50
        minLength: 2
        type: string
      gender:
        type: string
      last_name:
        maxLength: 50
        minLength: 2
        type: string
      phone_number:
        description: e164 validates international phone format like +998901234567
        type: string
    required:
    - first_name
    - last_name
    - phone_number
    type: object
  http.RideSearchResponse:
    properties:
      available_seats:
        type: integer
      departure_time:
        type: string
      destination_address:
        type: string
      destination_lat:
        type: number
      destination_lon:
        type: number
      driver:
        $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_ride_domain.DriverProfile'
      gender_restriction:
        type: string
      has_ac:
        type: boolean
      has_fair_price_badge:
        type: boolean
      has_luggage:
        type: boolean
      id:
        type: string
      is_negotiable:
        type: boolean
      origin_address:
        type: string
      origin_lat:
        type: number
      origin_lon:
        type: number
      pickup_point:
        type: string
      price_per_seat:
        type: number
      status:
        type: string
      takes_parcels:
        type: boolean
      total_seats:
        type: integer
    type: object
  http.RideStopRequest:
    properties:
      address:
        type: string
      lat:
        type: number
      lon:
        type: number
    required:
    - address
    - lat
    - lon
    type: object
  http.SendOTPRequest:
    properties:
      phone_number:
        type: string
    required:
    - phone_number
    type: object
  http.SetupPasswordRequest:
    properties:
      password:
        minLength: 6
        type: string
    required:
    - password
    type: object
  http.SubmitFeedbackRequest:
    properties:
      comment:
        type: string
      reviewee_id:
        type: string
      ride_id:
        type: string
      score:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - reviewee_id
    - ride_id
    - score
    type: object
  http.SubscribeDriverRequest:
    properties:
      payment_token_id:
        type: string
      plan_name:
        type: string
      promo_code:
        type: string
    required:
    - plan_name
    type: object
  http.UpdateProfileRequest:
    properties:
      first_name:
        maxLength: 50
        minLength: 2
        type: string
      gender:
        type: string
      last_name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - first_name
    - last_name
    type: object
  http.VerifyOTPRequest:
    properties:
      code:
        type: string
      phone_number:
        type: string
    required:
    - code
    - phone_number
    type: object
  http.createParcelRequest:
    properties:
      destination_lat:
        type: number
      destination_lon:
        type: number
      origin_lat:
        type: number
      origin_lon:
        type: number
      price:
        type: number
      receiver_phone:
        type: string
    required:
    - destination_lat
    - destination_lon
    - origin_lat
    - origin_lon
    - price
    - receiver_phone
    type: object
  http.logEventRequest:
    properties:
      event_type:
        type: string
      payload:
        additionalProperties: true
        type: object
      user_id:
        type: string
    required:
    - event_type
    type: object
  http.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  http.pingRequest:
    properties:
      heading:
        type: number
      latitude:
        type: number
      longitude:
        type: number
      speed:
        type: number
    required:
    - latitude
    - longitude
    type: object
  http.registerTokenRequest:
    properties:
      fcm_token:
        type: string
      language:
        type: string
      platform:
        type: string
    required:
    - fcm_token
    type: object
  http.reportMockLocationRequest:
    properties:
      description:
        type: string
    type: object
  http.setRemoteConfigRequest:
    properties:
      value:
        additionalProperties: true
        type: object
    required:
    - value
    type: object
  internal_helpdesk_delivery_http.createTicketRequest:
    properties:
      description:
        type: string
      subject:
        type: string
    required:
    - description
    - subject
    type: object
  internal_helpdesk_delivery_http.resolveTicketRequest:
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
    type: object
host: localhost:8090
info:
  contact: {}
  description: Microservice for customer support and ticketing.
  title: YolYolakay Helpdesk & Support API
  version: "1.0"
paths:
  /api/v1/analytics/events:
    post:
      consumes:
      - application/json
      description: Logs telemetry data/event into the Data Lake
      parameters:
      - description: Event Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.logEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Log a new analytics event
      tags:
      - analytics
  /api/v1/analytics/stats:
    get:
      description: Retrieves aggregated event counts for the BI Dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_analytics_domain.EventStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get event statistics
      tags:
      - analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using phone number and password
      parameters:
      - description: Phone and Password
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      - description: OS Type
        in: header
        name: X-OS-Type
        type: string
      - description: User Agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_auth_usecase.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with password
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new pair of tokens
      parameters:
      - description: Refresh Token
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_auth_usecase.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh JWT Token
      tags:
      - Auth
  /api/v1/auth/send-otp:
    post:
      consumes:
      - application/json
      description: Sends a 4-digit code to the specified phone number
      parameters:
      - description: Phone Number
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send OTP via SMS
      tags:
      - Auth
  /api/v1/auth/sessions:
    get:
      description: Retrieves all active sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_auth_domain.Session'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get active sessions
      tags:
      - Auth
  /api/v1/auth/sessions/{device_id}:
    delete:
      description: Terminates a specific active session by device_id
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Terminate session
      tags:
      - Auth
  /api/v1/auth/setup-password:
    post:
      consumes:
      - application/json
      description: Sets up a password for the authenticated user to login without
        OTP in the future
      parameters:
      - description: New Password
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.SetupPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup or update password
      tags:
      - Auth
  /api/v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies the OTP and issues JWT tokens
      parameters:
      - description: Phone and Code
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.VerifyOTPRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      - description: OS Type
        in: header
        name: X-OS-Type
        type: string
      - description: User Agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_auth_usecase.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP and Login
      tags:
      - Auth
  /api/v1/backoffice/admins/login:
    post:
      consumes:
      - application/json
      description: Authenticates an admin and returns their profile
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_backoffice_domain.Admin'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Admin login
      tags:
      - backoffice
  /api/v1/backoffice/configs/{key}:
    get:
      description: Retrieves a dynamic JSON configuration for the mobile app
      parameters:
      - description: Config Key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hextec_yolyolakay-backend_internal_backoffice_domain.RemoteConfig'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get remote config
      tags:
      - backoffice
    put:
      consumes:
      - application/json
      description: Sets or updates a dynamic JSON configuration for the mobile app
      parameters:
      - description: Config Key
        in: path
        name: key
        required: true
        type: string
      - description: Config Value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.setRemoteConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Set remote config
      tags:
      - backoffice
  /api/v1/billing/admin/gift-inject:
    post:
      consumes:
      - application/json
      description: Creates an async task to add free parcels to all active premium
        drivers
      parameters:
      - description: Gift quota details
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.GiftInjectRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
