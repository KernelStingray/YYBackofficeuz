        type: string
      type:
        description: e.g. "sms", "flashcall"
        type: string
    required:
    - code
    - phone_number
    type: object
  http.chatResponse:
    properties:
      last_message:
        $ref: '#/definitions/domain.Message'
      partner_id:
        type: string
      unread_count:
        type: integer
    type: object
  http.createParcelRequest:
    properties:
      deliver_by:
        description: ISO8601 string
        maxLength: 50
        type: string
      description:
        maxLength: 500
        type: string
      destination_lat:
        type: number
      destination_lon:
        type: number
      dropoff_type:
        maxLength: 20
        type: string
      from_address:
        maxLength: 255
        type: string
      origin_lat:
        type: number
      origin_lon:
        type: number
      price:
        maximum: 100000000
        type: number
      receiver_name:
        maxLength: 100
        type: string
      receiver_phone:
        maxLength: 20
        type: string
      size:
        maxLength: 50
        type: string
      to_address:
        maxLength: 255
        type: string
    required:
    - destination_lat
    - destination_lon
    - from_address
    - origin_lat
    - origin_lon
    - price
    - receiver_phone
    - to_address
    type: object
  http.createTicketRequest:
    properties:
      description:
        type: string
      subject:
        type: string
    required:
    - description
    - subject
    type: object
  http.logEventRequest:
    properties:
      event_type:
        type: string
      payload:
        additionalProperties: true
        type: object
      user_id:
        type: string
    required:
    - event_type
    type: object
  http.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  http.pingRequest:
    properties:
      heading:
        type: number
      latitude:
        type: number
      longitude:
        type: number
      speed:
        type: number
    required:
    - latitude
    - longitude
    type: object
  http.registerTokenRequest:
    properties:
      fcm_token:
        type: string
      language:
        type: string
      platform:
        type: string
    required:
    - fcm_token
    type: object
  http.reportMockLocationRequest:
    properties:
      description:
        type: string
    type: object
  http.resolveTicketRequest:
    properties:
      resolution:
        type: string
      ticket_id:
        type: string
    required:
    - resolution
    - ticket_id
    type: object
  http.setRemoteConfigRequest:
    properties:
      value:
        additionalProperties: true
        type: object
    required:
    - value
    type: object
host: api.yolyolakay.com
info:
  contact:
    email: support@hextec.uz
    name: HEXTEC Group
    url: https://hextec.uz
  description: Единая API документация для всех микросервисов платформы YolYolakay
    — райдшеринг, посылки, биллинг, телематика и др.
  license:
    name: Proprietary
    url: https://yolyolakay.uz/license
  termsOfService: https://yolyolakay.uz/terms
  title: YolYolakay Backend API
  version: "2.0"
paths:
  /api/v1/analytics/events:
    post:
      consumes:
      - application/json
      description: Logs telemetry data/event into the Data Lake
      parameters:
      - description: Event Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.logEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Log a new analytics event
      tags:
      - analytics
  /api/v1/analytics/stats:
    get:
      description: Retrieves aggregated event counts for the BI Dashboard
      parameters:
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Group by (e.g. day, month)
        in: query
        name: group_by
        type: string
      - description: Event type filter (e.g. app_open, ride_create)
        in: query
        name: event_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.EventStatsResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get event statistics
      tags:
      - analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using phone number and password
      parameters:
      - description: Phone and Password
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      - description: OS Type
        in: header
        name: X-OS-Type
        type: string
      - description: User Agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: New device detected, OTP required
          schema:
            additionalProperties:
              type: string
            type: object
        "423":
          description: Account temporarily locked
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with password
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new pair of tokens
      parameters:
      - description: Refresh Token
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh JWT Token
      tags:
      - Auth
  /api/v1/auth/send-otp:
    post:
      consumes:
      - application/json
      description: Sends a 5-digit code to the specified phone number
      parameters:
      - description: Phone Number
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found (for login/frgt_pswd)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: User already exists (for register)
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send OTP via SMS
      tags:
      - Auth
  /api/v1/auth/sessions:
    get:
      description: Retrieves all active sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.SessionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get active sessions
      tags:
      - Auth
  /api/v1/auth/sessions/{device_id}:
    delete:
      description: Terminates a specific active session by device_id
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Terminate session
      tags:
      - Auth
  /api/v1/auth/setup-password:
    post:
      consumes:
      - application/json
      description: Sets up a password for the authenticated user to login without
        OTP in the future
      parameters:
      - description: New Password
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.SetupPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup or update password
      tags:
      - Auth
  /api/v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies the OTP and issues JWT tokens (optionally sets password
        if provided)
      parameters:
      - description: Phone, Code and optional Password
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.VerifyOTPRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      - description: OS Type
        in: header
        name: X-OS-Type
        type: string
      - description: User Agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP and Login
      tags:
      - Auth
  /api/v1/backoffice/admins:
    get:
      description: Returns list of all admin users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Admin'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List admins
      tags:
      - backoffice
  /api/v1/backoffice/admins/login:
    post:
      consumes:
      - application/json
      description: Authenticates an admin and returns their profile
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Admin login
      tags:
      - backoffice
  /api/v1/backoffice/configs/{key}:
    get:
      description: Retrieves a dynamic JSON configuration for the mobile app
      parameters:
      - description: Config Key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get remote config
      tags:
      - backoffice
    put:
      consumes:
      - application/json
      description: Sets or updates a dynamic JSON configuration for the mobile app
      parameters:
      - description: Config Key
        in: path
        name: key
        required: true
        type: string
      - description: Config Value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.setRemoteConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Set remote config
      tags:
      - backoffice
  /api/v1/backoffice/logs/stream:
    get:
      description: Connects to Loki and streams logs via Server-Sent Events (SSE)
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Stream infrastructure logs
      tags:
      - backoffice
  /api/v1/billing/admin/gift-inject:
    post:
      consumes:
      - application/json
      description: Creates an async task to add free parcels to all active premium
        drivers
      parameters:
      - description: Gift quota details
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.GiftInjectRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inject free parcels to premium drivers
      tags:
      - Billing Admin
  /api/v1/billing/admin/stats:
    get:
      description: Fetch aggregated statistics for billing for admin dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AdminStats'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Fetch billing statistics
      tags:
      - Billing Admin
  /api/v1/billing/cards:
    get:
      consumes:
      - application/json
      description: returns all active payment tokens for a user
      produces:
      - application/json
      responses: {}
      summary: Get saved cards for a user
      tags:
      - Billing
    post:
      consumes:
      - application/json
      description: Mocks the saving of a card token from Click/Payme
      parameters:
      - description: Card token details
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.AddPaymentMethodRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Save a payment card token
      tags:
      - Billing
  /api/v1/billing/pay:
    post:
      consumes:
      - application/json
      description: Deducts money using a saved card and activates a SaaS plan
      parameters:
      - description: Subscription payment details
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.SubscribeDriverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Pay for a subscription
      tags:
      - Billing
  /api/v1/billing/plans:
    get:
      consumes:
      - application/json
      description: returns a static catalog of available subscription plans
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get available billing plans
      tags:
      - Billing
  /api/v1/billing/subscription:
    get:
      consumes:
      - application/json
      description: returns active subscription details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SubscriptionResponse'
      security:
      - BearerAuth: []
      summary: Get active subscription for a driver
      tags:
      - Billing
  /api/v1/billing/transactions/{id}:
    get:
      consumes:
      - application/json
      description: returns transaction status (pending, success, failed, cancelled)
      parameters:
      - description: Transaction ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get status of a payment transaction
      tags:
      - Billing
  /api/v1/bookings/{id}/cancel:
    post:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      - description: Cancel reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.CancelBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a booking (for passenger)
      tags:
      - bookings
  /api/v1/bookings/{id}/no-show:
    post:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Report a passenger no-show via booking ID
      tags:
      - bookings
  /api/v1/chats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.chatResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить список диалогов чата с последним сообщением
      tags:
      - notifications
      - chats
  /api/v1/chats/{peer_id}/messages:
    get:
      parameters:
      - description: Peer User ID
        in: path
        name: peer_id
        required: true
        type: string
      - description: Ride ID (опционально)
        in: query
        name: ride_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить историю сообщений конкретного чата
      tags:
      - chats
  /api/v1/fraud/report:
    post:
      consumes:
      - application/json
      description: Штрафует пользователя (обычно водителя) за использование фейковых
        координат
      parameters:
      - description: User Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.reportMockLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TrustScoreResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Сообщить о подмене GPS
      tags:
      - antifraud
  /api/v1/fraud/score:
    get:
      consumes:
      - application/json
      description: Возвращает текущий Trust Score (0-100) пользователя
      parameters:
      - description: User UUID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TrustScoreResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить текущий рейтинг доверия
      tags:
      - antifraud
  /api/v1/helpdesk/tickets:
    get:
      consumes:
      - application/json
      description: Возвращает список всех обращений текущего авторизованного пользователя
        из JWT токена
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Ticket'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить тикеты текущего пользователя
      tags:
      - helpdesk
    post:
      consumes:
      - application/json
      description: Создает обращение в службу поддержки (жалоба, ДТП, забытые вещи)
      parameters:
      - description: Ticket Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.createTicketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Ticket'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Создать новый тикет
      tags:
      - helpdesk
  /api/v1/helpdesk/tickets/resolve:
    post:
      consumes:
      - application/json
      description: Переводит тикет в статус RESOLVED и сохраняет текст ответа оператора
      parameters:
      - description: Ticket Resolution Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.resolveTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Ticket'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
