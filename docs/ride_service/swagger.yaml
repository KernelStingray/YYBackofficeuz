host: localhost:8083
info:
  contact: {}
  description: API for managing rides and bookings in Cluster B.
  title: Yolyolakay Ride Service API
  version: "1.0"
paths:
  /api/v1/analytics/events:
    post:
      consumes:
      - application/json
      description: Logs telemetry data/event into the Data Lake
      parameters:
      - description: Event Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.logEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Log a new analytics event
      tags:
      - analytics
  /api/v1/analytics/stats:
    get:
      description: Retrieves aggregated event counts for the BI Dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.EventStatsResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get event statistics
      tags:
      - analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using phone number and password
      parameters:
      - description: Phone and Password
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      - description: Device ID
        in: header
        name: X-Device-ID
        type: string
      - description: OS Type
        in: header
        name: X-OS-Type
        type: string
      - description: User Agent
        in: header
        name: User-Agent
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: New device detected, OTP required
          schema:
            additionalProperties:
              type: string
            type: object
        "423":
          description: Account temporarily locked
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with password
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new pair of tokens
      parameters:
      - description: Refresh Token
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh JWT Token
      tags:
      - Auth
  /api/v1/auth/send-otp:
    post:
      consumes:
      - application/json
      description: Sends a 5-digit code to the specified phone number
      parameters:
      - description: Phone Number
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/http.SendOTPRequest'
