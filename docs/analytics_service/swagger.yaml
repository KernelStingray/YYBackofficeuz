basePath: /
definitions:
  http.EventStatsResponse:
    properties:
      event_count:
        type: integer
      event_type:
        type: string
    type: object
  http.logEventRequest:
    properties:
      event_type:
        type: string
      payload:
        additionalProperties: true
        type: object
      user_id:
        type: string
    required:
    - event_type
    type: object
host: localhost:8091
info:
  contact: {}
  description: DWH & BI Analytics service for Yolyolakay
  title: Analytics Service API
  version: "1.0"
paths:
  /api/v1/analytics/events:
    post:
      consumes:
      - application/json
      description: Logs telemetry data/event into the Data Lake
      parameters:
      - description: Event Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.logEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Log a new analytics event
      tags:
      - analytics
  /api/v1/analytics/stats:
    get:
      description: Retrieves aggregated event counts for the BI Dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.EventStatsResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get event statistics
      tags:
      - analytics
swagger: "2.0"
