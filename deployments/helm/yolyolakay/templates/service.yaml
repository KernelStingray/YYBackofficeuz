{{- range .Values.microservices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yolyolakay.fullname" $ }}-{{ .name }}
  labels:
    {{- include "yolyolakay.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  type: {{ $.Values.defaults.service.type }}
  ports:
    - port: {{ .port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "yolyolakay.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
{{- end }}
