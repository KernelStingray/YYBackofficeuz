# ==============================================================================
# YOLYOLAKAY ENTERPRISE NGINX REVERSE PROXY CONFIGURATION
# Standard: TLS 1.3 / Strict HSTS / Security Headers / Rate Limiting
# ==============================================================================

# Rate Limiting Zones (защита от сканирования и DoS)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/s;

# Upstreams
upstream api_gateway_upstream {
    server 127.0.0.1:8080;
    keepalive 64;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yolyolakay.uz api.yolyolakay.com api.yolyolakay.co.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS API Gateway Endpoint
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yolyolakay.uz api.yolyolakay.com api.yolyolakay.co.uz;

    # SSL Certificates (Cloudflare Origin CA or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/yolyolakay.crt;
    ssl_certificate_key /etc/ssl/private/yolyolakay.key;

    # Modern TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Cloudflare Real-IP Restoration
    include /etc/nginx/conf.d/cloudflare_ips.conf;

    # Enterprise Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # Request Body & Buffering Limits
    client_max_body_size 15M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts (Slowloris Protection)
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # Gzip & Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting on Authentication Endpoints
    location /api/v1/auth/ {
        limit_req zone=auth_strict_limit burst=10 nodelay;
        
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Routes
    location / {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Realtime Telematics & Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Metrics (Blocked from external access, only localhost/Prometheus)
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://api_gateway_upstream/metrics;
    }
}
