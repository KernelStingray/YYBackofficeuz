# ==============================================================================
# YOLYOLAKAY ENTERPRISE PGBOUNCER CONFIGURATION
# High-Throughput Connection Pooler (Transaction Mode)
# ==============================================================================

[databases]
yolyolakay_users = host=postgres_a port=5432 dbname=yolyolakay_users auth_user=postgres
yolyolakay_rides = host=postgres_b port=5432 dbname=yolyolakay_rides auth_user=postgres
yolyolakay_billing = host=postgres_b port=5432 dbname=yolyolakay_billing auth_user=postgres
yolyolakay_parcels = host=postgres_b port=5432 dbname=yolyolakay_parcels auth_user=postgres
yolyolakay_telematics = host=postgres_b port=5432 dbname=yolyolakay_telematics auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling maximizes concurrent client capacity
pool_mode = transaction

# Connection limits
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 100

# Timeouts and keepalives
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

# TLS Configuration
server_tls_sslmode = prefer
